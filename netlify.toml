[build]
  publish = "."

# Block build artifacts / secrets from ever being served publicly
[[redirects]]
  from = "/android-twa/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.keystore"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/data.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "no-cache"
